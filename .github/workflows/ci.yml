name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      - run: npm test

      # Catches dependency bumps in demo/ that break the demo build.
      - name: Build demo
        working-directory: demo
        run: |
          npm ci
          npm run build
